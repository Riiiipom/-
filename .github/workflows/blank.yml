name: Ntfy Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test notification
        run: |
          curl \
            -H "Title: 🚨 ハイキュー!!展テスト通知" \
            -H "Priority: urgent" \
            -H "Tags: warning" \
            -d "通知テスト成功！！🎉 GitHubからiPhoneに届いています！" \
            https://ntfy.sh/eplus-haikyu-EM-84729163
