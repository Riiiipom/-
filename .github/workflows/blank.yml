name: Eplus Haikyu Ticket Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4

      - name: Check Eplus
        env:
          NTFY_TOPIC: eplus-haikyu-EM-84729163
        run: |
          python <<'PY'
          import json
          import os
          import re
          import requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          URL = "https://eplus.jp/sf/detail/4540050001-P0030002"
          TOPIC = os.environ["NTFY_TOPIC"]
          STATE_FILE = Path("eplus_state.json")

          TARGET_TIMES = [
              "10:00",
              "10:30",
              "11:00",
              "11:30",
              "12:00",
              "12:30",
              "13:00",
              "13:30",
              "14:00",
              "14:30",
              "15:00",
              "15:30",
              "16:00",
              "16:30",
          ]

          STATUSES = [
              "受付中",
              "予定枚数終了",
              "受付前",
              "受付終了",
          ]

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) "
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                  "Version/18.7 Mobile/15E148 Safari/604.1"
              ),
              "Accept-Language": "ja-JP,ja;q=0.9",
          }

          print("イープラスを確認しています...")
          print(URL)

          response = requests.get(
              URL,
              headers=headers,
              timeout=30
          )

          print("HTTP:", response.status_code)

          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")

          lines = [
              line.strip()
              for line in soup.get_text("\n").splitlines()
              if line.strip()
          ]

          current = {}

          for time in TARGET_TIMES:

              target = f"入場回：{time}～"

              for i, line in enumerate(lines):

                  if target not in line:
                      continue

                  # この入場回の後ろにある販売状況を探す
                  status = None

                  for next_line in lines[i:i+25]:

                      if next_line in STATUSES:
                          status = next_line
                          break

                  if status:
                      current[time] = status
                      print(f"{time} → {status}")
                  else:
                      print(f"{time} → 状態を取得できませんでした")

                  break

          print()
          print("取得した状態数:", len(current))

          # 状態が1つも取れなかった場合は、
          # 誤判定を防ぐため通知・保存をしない
          if not current:
              raise RuntimeError(
                  "10/31のチケット状態を取得できませんでした"
              )

          # 初回
          if not STATE_FILE.exists():

              STATE_FILE.write_text(
                  json.dumps(
                      current,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("初回監視。現在の状態を保存しました。")
              raise SystemExit(0)

          old = json.loads(
              STATE_FILE.read_text(encoding="utf-8")
          )

          recovered = []

          for time in TARGET_TIMES:

              old_status = old.get(time)
              new_status = current.get(time)

              if (
                  old_status == "予定枚数終了"
                  and new_status == "受付中"
              ):
                  recovered.append(time)

          # 状態保存
          STATE_FILE.write_text(
              json.dumps(
                  current,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # 復活通知
          if recovered:

              message = (
                  "🚨🚨 ハイキュー!!展 チケット復活！！ 🚨🚨\n\n"
                  "2026年10月31日(土)\n\n"
                  + "\n".join(
                      f"🎫 {time}〜"
                      for time in recovered
                  )
                  + "\n\n"
                  + URL
              )

              requests.post(
                  f"https://ntfy.sh/{TOPIC}",
                  data=message.encode("utf-8"),
                  headers={
                      "Title": "🚨 ハイキュー!!展 チケット復活！",
                      "Priority": "urgent",
                      "Tags": "rotating_light,ticket"
                  },
                  timeout=20
              )

              print("🚨 チケット復活を通知しました！")

          else:
              print("変化なし。")

          PY

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add eplus_state.json

          if git diff --cached --quiet; then
            echo "状態に変更なし"
          else
            git commit -m "Update eplus ticket state"
            git push
          fi
