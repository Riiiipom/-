name: MECHATU-A Ticket Monitor Test

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check eplus pages
        run: |
          pip install requests beautifulsoup4

          python <<'PY'
          import requests
          from bs4 import BeautifulSoup

          URLS = {
              "公演ページ": "https://eplus.jp/sf/detail/4569850001"
          }

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) "
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                  "Version/18.7 Mobile/15E148 Safari/604.1"
              ),
              "Accept-Language": "ja-JP,ja;q=0.9",
          }

          for name, url in URLS.items():
              print(f"\n===== {name} =====")
              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=30
                  )
                  print("HTTP:", response.status_code)
                  print("最終URL:", response.url)

                  response.raise_for_status()

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser"
                  )

                  text = soup.get_text(" ", strip=True)
                  print("ページタイトル:", soup.title.get_text(strip=True)
                        if soup.title else "なし")
                  print("ページ文字数:", len(text))
                  print("販売状況の文字:", [
                      word for word in
                      ["○", "△", "×", "受付中",
                       "予定枚数終了", "同意", "エラー"]
                      if word in text
                  ])
                  print("ページ本文の先頭:")
                  print(text[:1500])

              except Exception as e:
                  print("取得失敗:", repr(e))

          PY
