name: MECHATU-A Ticket Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check eplus page
        run: |
          pip install requests beautifulsoup4

          python <<'PY'
          import requests
          from bs4 import BeautifulSoup

          url = "https://eplus.jp/sf/detail/4569850001"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) "
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                  "Version/18.7 Mobile/15E148 Safari/604.1"
              ),
              "Accept-Language": "ja-JP,ja;q=0.9",
          }

          response = requests.get(
              url,
              headers=headers,
              timeout=30
          )
          print("HTTP:", response.status_code)
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")
          text = soup.get_text(" ", strip=True)

          print("ページ取得成功")
          print("一般発売の出現回数:", text.count("一般発売"))

          positions = []
          start = 0

          while True:
              pos = text.find("一般発売", start)
              if pos == -1:
                  break
              positions.append(pos)
              start = pos + len("一般発売")

          for i, pos in enumerate(positions):
              before = text[max(0, pos - 100):pos]
              end = positions[i + 1] if i + 1 < len(positions) else min(len(text), pos + 500)
              section = text[pos:end]

              if "見切れ席" in before:
                  name = "見切れ席"
              else:
                  name = "普通席"

              if "受付中" in section:
                  status = "受付中"
              elif "予定枚数終了" in section:
                  status = "予定枚数終了"
              else:
                  status = "判定できず"

              print(f"{name}: {status}")
              print("確認用:", section[:250])

          PY
